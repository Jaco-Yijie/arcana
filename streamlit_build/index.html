    <!-- 字体预加载 —— **只预载与语言无关的那一个**。
         Cinzel 是品牌名 ARCANA 的字，中英两种界面下都在首屏出现，所以静态预载。

         中文展示字体（LXGW 文楷子集，68.4 KB）**刻意不在这里预载**：
         英文界面下屏幕上没有一个汉字，预载它等于让英文用户白下 68 KB。
         它的 @font-face 与 preload 都由 src/i18n/boot.ts 在语言确定之后注入
         （见那里的 ensureFonts），所以中文用户拿到它的时间只比这里晚一个微任务。

         Cormorant 属于 Ritual 档，只在 Reading 页与章节标题上出现，首屏用不到。

         `lang` 属性同样由 boot.ts 按语言改写 —— HTML 里这个初始值是给
         首字节到 JS 执行之间那一小段时间用的，以及给不跑 JS 的抓取器。 -->
    <link rel="preload" href="./fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Arcana</title>
    <script type="module" crossorigin src="./assets/index-LjGOfEF_.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/localized-BwPLEFjC.js">
    <link rel="modulepreload" crossorigin href="./assets/AppShell-Cz0Cim7A.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CM0ECGrn.css">
  </head>

  </body>
